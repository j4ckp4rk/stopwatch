<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스탑워치</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d1f23;
    --muted: #6b7280;
    --line: #e5e7eb;
    --start: #16a34a;
    --stop: #dc2626;
    --neutral: #e5e7eb;
    --neutral-text: #1d1f23;
    --best: #16a34a;
    --worst: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --card: #1b1e23;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --line: #2d3138;
      --neutral: #2d3138;
      --neutral-text: #f3f4f6;
      --best: #4ade80;
      --worst: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 24px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
  }
  .display {
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-size: clamp(44px, 14vw, 64px);
    font-weight: 300;
    letter-spacing: 1px;
  }
  .display .ms { font-size: .55em; color: var(--muted); }
  .buttons {
    display: flex;
    justify-content: space-between;
    margin: 28px 0 20px;
    gap: 12px;
  }
  button {
    flex: 1;
    height: 56px;
    border: none;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .08s, opacity .15s;
  }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .4; cursor: default; }
  #lapBtn { background: var(--neutral); color: var(--neutral-text); }
  #startBtn { background: var(--start); color: #fff; }
  #startBtn.running { background: var(--stop); }
  .laps {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 300px;
    overflow-y: auto;
    border-top: 1px solid var(--line);
  }
  .laps li {
    display: flex;
    justify-content: space-between;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .laps li .total { color: var(--muted); font-size: 14px; }
  .laps li.best { color: var(--best); }
  .laps li.worst { color: var(--worst); }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="display" id="display">00:00<span class="ms">.00</span></div>
    <div class="buttons">
      <button id="lapBtn" disabled>랩</button>
      <button id="startBtn">시작</button>
    </div>
    <ul class="laps" id="laps"></ul>
    <div class="hint">Space: 시작/정지 · L: 랩 · R: 초기화</div>
  </div>

<script>
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapsEl = document.getElementById('laps');

  let running = false;
  let startTime = 0;   // performance.now() at (re)start
  let elapsed = 0;     // accumulated ms before current run
  let rafId = null;
  let laps = [];       // lap durations in ms
  let lastLapTotal = 0;

  function now() { return elapsed + (running ? performance.now() - startTime : 0); }

  function format(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    const pad = n => String(n).padStart(2, '0');
    const main = (h > 0 ? h + ':' : '') + pad(m) + ':' + pad(s);
    return { main, cs: '.' + pad(cs) };
  }

  function render() {
    const t = format(now());
    display.innerHTML = `${t.main}<span class="ms">${t.cs}</span>`;
  }

  function tick() {
    render();
    rafId = requestAnimationFrame(tick);
  }

  function updateButtons() {
    startBtn.textContent = running ? '정지' : '시작';
    startBtn.classList.toggle('running', running);
    if (running) {
      lapBtn.textContent = '랩';
      lapBtn.disabled = false;
    } else {
      lapBtn.textContent = '초기화';
      lapBtn.disabled = now() === 0;
    }
  }

  function toggle() {
    if (running) {
      elapsed += performance.now() - startTime;
      running = false;
      cancelAnimationFrame(rafId);
      render();
    } else {
      startTime = performance.now();
      running = true;
      tick();
    }
    updateButtons();
  }

  function lap() {
    const total = now();
    laps.unshift(total - lastLapTotal);
    lastLapTotal = total;
    renderLaps(total);
  }

  function reset() {
    elapsed = 0;
    laps = [];
    lastLapTotal = 0;
    render();
    renderLaps();
    updateButtons();
  }

  function renderLaps() {
    lapsEl.innerHTML = '';
    let min = Infinity, max = -Infinity;
    if (laps.length >= 2) { min = Math.min(...laps); max = Math.max(...laps); }
    let running = lastLapTotal;
    laps.forEach((d, i) => {
      const li = document.createElement('li');
      if (d === min) li.className = 'best';
      else if (d === max) li.className = 'worst';
      const f = format(d), tf = format(running);
      li.innerHTML = `<span>랩 ${laps.length - i}</span><span class="total">${tf.main}${tf.cs}</span><span>${f.main}${f.cs}</span>`;
      running -= d;
      lapsEl.appendChild(li);
    });
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', () => running ? lap() : reset());

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') { if (running) lap(); }
    else if (e.key === 'r' || e.key === 'R') { if (!running) reset(); }
  });
</script>
</body>
</html>
